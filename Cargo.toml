[package]
name = "computer-use-indicator"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "On-screen indicator for AI agents driving a Linux desktop through computer use"
repository = "https://github.com/netherguy4/computer-use-indicator"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["applet", "tokio", "wayland", "wgpu"]
